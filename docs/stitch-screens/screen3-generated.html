<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - ElectroLink</title>
<!-- Load Inter Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            el: {
              primary: '#2e3a59',
              bgSoft: '#e8eef7',
              warmGray: '#a9b1ba',
              celeste: '#b5d5f5',
              accent: '#ffe492',
              custom: '#1978e5'
            }
          },
          borderRadius: {
            'el-round': '8px',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="theme-implementation">
    :root {
      --el-primary: #2e3a59;
      --el-bg-soft: #e8eef7;
      --el-warm-gray: #a9b1ba;
      --el-celeste: #b5d5f5;
      --el-accent: #ffe492;
      --el-custom: #1978e5;
    }
    
    body {
      background-color: var(--el-bg-soft);
      font-family: 'Inter', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(46, 58, 89, 0.1);
    }

    .role-radio:checked + label {
      border-color: var(--el-custom);
      background-color: #f0f7ff;
      color: var(--el-custom);
      box-shadow: 0 0 0 1px var(--el-custom);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: Register Card -->
<main class="w-full max-w-md" data-purpose="registration-container">
<div class="glass-card rounded-el-round p-8 md:p-10 border border-white">
<!-- Brand Header -->
<header class="text-center mb-8" data-purpose="brand-header">
<h1 class="text-2xl font-bold text-el-primary flex items-center justify-center gap-2">
<svg class="w-8 h-8 text-el-custom" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          ElectroLink
        </h1>
<p class="text-el-warm-gray mt-2 text-sm">Join the network of professional energy solutions</p>
</header>
<!-- Registration Form -->
<form action="#" class="space-y-6" data-purpose="registration-form" method="POST">
<!-- Role Selection -->
<div class="space-y-3" data-purpose="role-selection">
<label class="block text-sm font-semibold text-el-primary">Select your role</label>
<div class="grid grid-cols-2 gap-4">
<!-- Homeowner Option -->
<div class="relative">
<input checked="" class="role-radio hidden" id="role-homeowner" name="role" type="radio" value="homeowner"/>
<label class="flex flex-col items-center justify-center p-4 border-2 border-el-celeste rounded-el-round cursor-pointer transition-all hover:border-el-custom text-el-primary font-medium" for="role-homeowner">
<span class="text-sm">Homeowner</span>
</label>
</div>
<!-- Technician Option -->
<div class="relative">
<input class="role-radio hidden" id="role-technician" name="role" type="radio" value="technician"/>
<label class="flex flex-col items-center justify-center p-4 border-2 border-el-celeste rounded-el-round cursor-pointer transition-all hover:border-el-custom text-el-primary font-medium" for="role-technician">
<span class="text-sm">Technician</span>
</label>
</div>
</div>
</div>
<!-- Email Field -->
<div class="space-y-1">
<label class="block text-sm font-semibold text-el-primary" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-el-round border-el-celeste focus:ring-el-custom focus:border-el-custom transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="block text-sm font-semibold text-el-primary" for="password">Password</label>
<input class="w-full px-4 py-3 rounded-el-round border-el-celeste focus:ring-el-custom focus:border-el-custom transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1">
<label class="block text-sm font-semibold text-el-primary" for="confirm-password">Confirm Password</label>
<input class="w-full px-4 py-3 rounded-el-round border-el-celeste focus:ring-el-custom focus:border-el-custom transition-colors" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-el-custom border-el-celeste rounded focus:ring-el-custom" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="text-el-warm-gray" for="terms">
              I agree to the <a class="text-el-custom font-medium hover:underline" href="#">Terms of Service</a> and <a class="text-el-custom font-medium hover:underline" href="#">Privacy Policy</a>.
            </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-el-custom hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-el-round transition-all transform active:scale-[0.98] shadow-lg shadow-blue-500/20" type="submit">
          Create Account
        </button>
</form>
<!-- Footer Actions -->
<footer class="mt-8 pt-6 border-t border-el-celeste/50 text-center" data-purpose="card-footer">
<p class="text-sm text-el-warm-gray">
          Already have an account? 
          <a class="text-el-primary font-semibold hover:underline" href="#">Sign in</a>
</p>
</footer>
</div>
<!-- Support/Security Badge -->
<div class="mt-6 flex justify-center items-center gap-4 text-xs text-el-warm-gray uppercase tracking-widest font-medium">
<span class="flex items-center gap-1">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
        Secure SSL
      </span>
<span>•</span>
<span>24/7 Support</span>
</div>
</main>
<!-- END: Register Card -->
</body></html>
